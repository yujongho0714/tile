// 이어하기: 가장 최근에 수련한 스테이지 (기록이 없으면 지금 열린 마지막 스테이지)
function resumeIndex(){
  const l = LS.get('last', null), vis = Math.min(11, progress.unlocked);
  return (typeof l === 'number' && l >= 0 && l <= vis) ? l : vis;
}
(function buildSky(){
  const mk = (n, min, max) => {
    let h = '';
    for(let k = 0; k < n; k++){
      const x = (Math.random() * 100).toFixed(1), y = Math.random() * 50, sz = (min + Math.random() * (max - min)).toFixed(1);
      const dl = (Math.random() * 4).toFixed(2), du = (2 + Math.random() * 3).toFixed(1);
      [y, y + 50].forEach(yy => { h += `<i style="left:${x}%;top:${yy.toFixed(2)}%;width:${sz}px;height:${sz}px;animation-delay:-${dl}s;animation-duration:${du}s"></i>`; });
    }
    return h;
  };
  $('#sp-l1').innerHTML = mk(36, 1, 1.8); $('#sp-l2').innerHTML = mk(22, 1.6, 2.6); $('#sp-l3').innerHTML = mk(10, 2.4, 3.6);
})();
function titleSetup(){
  $('#tt-who').innerHTML = profile.name
    ? `<span><b>${esc(profile.name)}</b> 님, 어서 와요!</span><small>${STAGES[resumeIndex()].key}부터 이어서 시작해요</small>`
    : `<span>처음 오셨네요!</span><small>동전을 넣고 이름을 입력해요</small>`;
}
let coinBusy = false, coinStart = null, coinSuppress = false;
function insertCoin(viaDrag){
  if(coinBusy) return; coinBusy = true;
  const coin = $('#coin-btn');
  SFX.click(); $('#tt-hint').textContent = '';
  let hitAt;
  if(viaDrag === true){            // 끌어다 투입구에 놓은 경우: 동전이 투입구로 쏙 빨려 들어가요
    const t = centerOf($('#coin-slot'));
    coin.classList.add('drag', 'in');
    coin.style.transform = `translate(${t.x - coinStart.x}px,${t.y - coinStart.y}px) scale(.5,.3)`;
    coin.style.opacity = '0';
    hitAt = REDUCED ? 0 : 260;
  }else{                           // 그냥 누른 경우: 동전이 위로 올라가 들어가요
    coin.classList.add('go');
    hitAt = REDUCED ? 0 : 540;
  }
  setTimeout(() => {
    SFX.coin(); $('#coin-slot').classList.add('hit'); $('#tt-credit').textContent = '1';
    const ins = $('#tt-insert'); ins.textContent = 'GAME START!'; ins.classList.add('ok');
    const c = centerOf($('#coin-slot'));
    FX.burst(c.x, c.y, ['#ffd23f', '#fff', '#ffe680'], 18, { shapes:['star','circle'], speed:320, size:6, g:500, life:.8 });
    FX.ring(c.x, c.y, '#ffd23f', 90, .5);
    setTimeout(SFX.go, 260);
  }, hitAt);
  setTimeout(() => { if(profile.name) leaveTitle(); else openNameModal(leaveTitle); }, REDUCED ? 400 : hitAt + 910);
}
function leaveTitle(){
  const t = $('#scr-title'); if(t.hidden) return;
  const idx = resumeIndex();
  scrollMapTo(idx, false); bgmPlay('map');
  t.classList.add('out'); setTimeout(() => { t.hidden = true; }, REDUCED ? 0 : 650);
  if(progress.unlocked > 0 || LS.get('last', null) != null) setTimeout(() => toast(`<b style="color:var(--gold)">${esc(profile.name)}</b> 님, <b style="color:var(--gold)">${STAGES[idx].key}</b>부터 이어서 해요!`), 500);
  if(!STUDENT_MODE && !STORE_OK) setTimeout(() => toast('⚠️ 이 화면에서는 설정·기록이 저장되지 않아요.<br>크롬·사파리로 열어 주세요'), 1800);
}
(function coinDrag(){
  const coin = $('#coin-btn'), slot = $('#coin-slot');
  let id = null, sx = 0, sy = 0, dragging = false;
  const over = () => {
    const c = coin.getBoundingClientRect(), s = slot.getBoundingClientRect(), pad = 26, cx = c.left + c.width / 2, cy = c.top + c.height / 2;
    return cx > s.left - pad && cx < s.right + pad && cy > s.top - pad && cy < s.bottom + pad;
  };
  coin.addEventListener('pointerdown', e => {
    if(coinBusy || id !== null) return;
    id = e.pointerId; sx = e.clientX; sy = e.clientY; dragging = false;
    try{ coin.setPointerCapture(id); }catch(_){}
  });
  coin.addEventListener('pointermove', e => {
    if(e.pointerId !== id) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(!dragging){
      if(Math.hypot(dx, dy) < 9) return;
      dragging = true; coin.classList.add('drag'); coinStart = centerOf(coin);   // 둥둥 뜨는 효과를 끄고 손가락을 따라가요
    }
    coin.style.transform = `translate(${dx}px,${dy}px) scale(1.1)`;
    slot.classList.toggle('near', over());
  });
  const end = e => {
    if(e.pointerId !== id) return; id = null;
    try{ coin.releasePointerCapture(e.pointerId); }catch(_){}
    slot.classList.remove('near');
    if(!dragging) return;            // 끌지 않고 그냥 누른 경우는 click 이 처리해요
    dragging = false; coinSuppress = true; setTimeout(() => { coinSuppress = false; }, 80);
    if(e.type === 'pointerup' && over()) insertCoin(true);
    else { coin.classList.add('back'); coin.style.transform = ''; setTimeout(() => coin.classList.remove('drag', 'back'), 340); }
  };
  coin.addEventListener('pointerup', end); coin.addEventListener('pointercancel', end);
  coin.addEventListener('click', () => { if(coinSuppress) return; insertCoin(); });
})();
if(LS.get('profile', null) == null){ const ps = getCfg().plateStart; if(Number.isInteger(ps) && ps >= 0 && ps < PLATE_NAMES.length){ profile.plate = ps; } }   // 처음 여는 기기: 관리자가 정한 시작 플레이트
titleSetup();
showScreen('map'); renderMap(); scrollMapTo(resumeIndex(), false);   // 시작 화면 뒤에서 지도를 미리 준비해요
