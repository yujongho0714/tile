<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>태권도 타일 마스터</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=Jua&amp;display=swap" rel="stylesheet">
<style>
/* 레이아웃: 밤의 도장 오락실 — 세로 한 화면 앱, 아래에서 위로 올라가는 스테이지 지도 + 젤리 타일 게임판 */
:root{
  --bg0:#0c0724; --bg1:#1a1048; --bg2:#2b1a72;
  --card0:#2c1e7a; --card1:#190f4c;
  --gold:#ffd23f; --gold-d:#c88600;
  --pink:#ff4f8b; --mint:#2fe3a5; --sky:#46b8ff; --red:#ff4d5e;
  --text:#ffffff; --muted:#b8afe6; --line:rgba(255,255,255,.12);
  --bg0t:rgba(12,7,36,0); --glow1:rgba(120,70,255,.35); --glow2:rgba(255,70,160,.22); --glow3:rgba(40,160,255,.25);
  --f-disp:'Black Han Sans','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-ui:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg0)}
body{color:var(--text);font-family:var(--f-ui);-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text;font-family:var(--f-ui)}
button{font-family:var(--f-ui);color:inherit}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:
   radial-gradient(60% 40% at 15% 10%, var(--glow1), transparent 70%),
   radial-gradient(50% 35% at 90% 30%, var(--glow2), transparent 70%),
   radial-gradient(70% 50% at 50% 100%, var(--glow3), transparent 70%),
   linear-gradient(var(--bg0), var(--bg1) 60%, var(--bg0));}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:
   radial-gradient(1.4px 1.4px at 23px 41px,#fff,transparent),
   radial-gradient(1px 1px at 97px 12px,#fff,transparent),
   radial-gradient(1.6px 1.6px at 150px 120px,#ffe9a8,transparent),
   radial-gradient(1px 1px at 61px 170px,#fff,transparent),
   radial-gradient(1.2px 1.2px at 190px 75px,#cfe6ff,transparent);
  background-size:210px 210px;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.25}}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
#app.shake{animation:appShake .4s}
@keyframes appShake{0%,100%{transform:none}20%{transform:translate(-9px,3px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(4px,-1px)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
[hidden]{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* ---------- 공통 버튼 ---------- */
.btn{--b:#ff4f8b;--bl:#ff86b0;--bd:#b81e58;position:relative;border:0;border-radius:18px;padding:14px 18px;font-size:19px;line-height:1.1;cursor:pointer;color:#fff;
  background:linear-gradient(var(--bl),var(--b) 70%);
  box-shadow:inset 0 -5px 0 var(--bd),inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 rgba(0,0,0,.28);
  text-shadow:0 2px 0 rgba(0,0,0,.22);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--bd),inset 0 2px 0 rgba(255,255,255,.45),0 2px 0 rgba(0,0,0,.28)}
.btn:focus-visible,.icon-btn:focus-visible,.node:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.gold{--b:#ffbd14;--bl:#ffe680;--bd:#c07600;color:#5b3000;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.mint{--b:#18c487;--bl:#6ff3c3;--bd:#0b815a}
.btn.sky{--b:#2f8dff;--bl:#7cc0ff;--bd:#1854b8}
.btn.ghost{--b:rgba(255,255,255,.1);--bl:rgba(255,255,255,.18);--bd:rgba(0,0,0,.35)}
.btn.danger{--b:#e8344a;--bl:#ff7b8a;--bd:#9c1426}
.btn.big{font-size:24px;padding:18px 20px;border-radius:22px;font-family:var(--f-disp);letter-spacing:.5px}
.btn.sm{font-size:15px;padding:9px 12px;border-radius:13px;box-shadow:inset 0 -3px 0 var(--bd),inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.25)}
.btn[disabled]{filter:grayscale(1) brightness(.7);pointer-events:none}
.icon-btn{width:42px;height:42px;flex:none;border-radius:14px;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;
  background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.07));
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.icon-btn:active{transform:translateY(2px)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.off{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}

/* ---------- 네임플레이트 ---------- */
.plate{position:relative;width:100%;container-type:inline-size;line-height:0}
.plate img{width:100%;height:auto;display:block;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.plate-name{position:absolute;left:30.5%;right:6%;top:0;bottom:3%;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-disp);font-size:24px;font-size:clamp(12px,11.5cqw,64px);line-height:1;color:var(--pn,#fff);white-space:nowrap;overflow:hidden;letter-spacing:.02em;
  text-shadow:0 .06em 0 rgba(0,0,0,.65),0 0 .12em rgba(0,0,0,.8),.05em .05em 0 rgba(0,0,0,.5),-.05em .05em 0 rgba(0,0,0,.5)}
.plate.locked img{filter:grayscale(1) brightness(.35) contrast(1.1)}
.plate.locked .plate-name{color:#9b94c4;text-shadow:none;font-size:clamp(11px,7cqw,40px)}
.plate.shine::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.65) 48%,transparent 60%);background-size:250% 100%;
  -webkit-mask:var(--mask) center/100% 100% no-repeat;mask:var(--mask) center/100% 100% no-repeat;animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%{background-position:130% 0}55%,100%{background-position:-60% 0}}

/* ---------- 지도 화면 ---------- */
.map-head{position:relative;z-index:6;padding:12px 16px 4px;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(var(--bg0) 55%,var(--bg0t))}
.mh-row{display:flex;align-items:center;gap:6px}
.logo{flex:1;min-width:0;line-height:1}
.logo b{display:block;white-space:nowrap;font-family:var(--f-disp);font-size:22px;letter-spacing:.5px;
  background:linear-gradient(#fff4b8,#ffd23f 55%,#ff9d1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #7a3a00)}
.logo small{font-size:12px;color:var(--muted)}
.star-pill{display:flex;align-items:center;gap:4px;height:34px;padding:0 10px 0 6px;border-radius:99px;background:rgba(0,0,0,.35);
  box-shadow:inset 0 0 0 2px rgba(255,210,63,.35);font-size:16px;font-variant-numeric:tabular-nums}
.star-pill svg{width:22px;height:22px}
.mh-row2{display:flex;align-items:center;gap:10px}
.mh-tools{flex:none;display:grid;grid-template-columns:repeat(2,40px);gap:6px}
.mh-tools .icon-btn{width:40px;height:40px}
.mh-tools.three{grid-template-columns:repeat(3,38px)}.mh-tools.three .icon-btn{width:38px;height:38px}
.mh-plate{flex:1;min-width:0;max-width:340px;margin:0 auto;cursor:pointer;transition:transform .15s}
.mh-plate:active{transform:scale(.97)}
.mh-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:-2px}
.map-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.map-scroll::-webkit-scrollbar{display:none}
.map-inner{position:relative;width:100%}
.map-path{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.zone{position:absolute;left:16px;right:16px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.belt{position:relative;width:100%;height:30px;border-radius:6px;background:linear-gradient(#2a2a33,#0b0b10);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.belt::before,.belt::after{content:"";position:absolute;top:22px;width:18px;height:46px;background:linear-gradient(#22222b,#0b0b10);border-radius:3px;box-shadow:0 6px 10px rgba(0,0,0,.4)}
.belt::before{left:calc(50% - 34px);transform:rotate(14deg)}
.belt::after{left:calc(50% + 16px);transform:rotate(-14deg)}
.belt span{position:relative;z-index:1;font-family:var(--f-disp);font-size:15px;letter-spacing:3px;color:var(--gold);background:#0b0b10;padding:3px 12px;border-radius:5px;box-shadow:0 0 0 2px #c9a227}
.zone-label{font-family:var(--f-disp);font-size:14px;letter-spacing:3px;color:rgba(255,255,255,.55);padding:5px 14px;border-radius:99px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line)}
.node{position:absolute;width:88px;height:88px;margin:-44px 0 0 -44px;border:0;padding:0;background:none;cursor:pointer;z-index:2}
.node-glow{position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 65%);opacity:.45;filter:blur(4px)}
.node-face{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .15s;
  background:radial-gradient(circle at 34% 26%,var(--cl) 0 14%,var(--c) 52%,var(--cd) 100%);
  box-shadow:inset 0 -7px 0 var(--cdd),inset 0 4px 0 rgba(255,255,255,.45),0 0 0 5px #fff,0 0 0 9px var(--cd),0 9px 0 4px rgba(0,0,0,.35),0 16px 26px rgba(0,0,0,.45)}
.node:active .node-face{transform:scale(.93)}
.node-face small{font-size:13px;line-height:1;opacity:.92;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.node-face b{font-family:var(--f-disp);font-size:27px;line-height:1;font-weight:400;text-shadow:0 2px 0 var(--cdd),0 0 6px rgba(0,0,0,.25)}
.node-stars{position:absolute;left:50%;top:94px;transform:translateX(-50%);display:flex;gap:1px}
.node-stars svg{width:22px;height:22px}
.node-stars svg:nth-child(2){transform:translateY(5px)}
.node.locked .node-glow{display:none}
.node.locked .node-face{background:radial-gradient(circle at 34% 26%,#77729c 0 10%,#45406c 55%,#272246);
  box-shadow:inset 0 -7px 0 #1b1734,inset 0 4px 0 rgba(255,255,255,.18),0 0 0 5px #57527e,0 0 0 9px #2a2550,0 9px 0 4px rgba(0,0,0,.35),0 16px 26px rgba(0,0,0,.45)}
.node.locked .node-face small,.node.locked .node-face b{opacity:.28;text-shadow:none}
.chain{position:absolute;left:-16px;right:-16px;top:50%;height:13px;margin-top:-6px;border-radius:7px;pointer-events:none;
  background:repeating-linear-gradient(90deg,#d8d3ee 0 8px,#8f89b3 8px 10px,#5c5683 10px 12px);box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.5)}
.chain.a{transform:rotate(34deg)}.chain.b{transform:rotate(-34deg)}
.lock{position:absolute;left:50%;top:50%;width:40px;height:46px;transform:translate(-50%,-42%);pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.node:not(.locked) .chain,.node:not(.locked) .lock{display:none}
.node.rattle{animation:rattle .5s ease-in-out 2}
@keyframes rattle{0%,100%{transform:none}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.node.breaking .chain,.node.breaking .lock{display:block}
.node.breaking .chain.a{animation:chainA .7s cubic-bezier(.2,.7,.3,1) forwards}
.node.breaking .chain.b{animation:chainB .7s cubic-bezier(.2,.7,.3,1) forwards}
.node.breaking .lock{animation:lockFall .8s cubic-bezier(.5,0,.8,.5) forwards}
@keyframes chainA{to{transform:translate(-90px,-70px) rotate(-30deg) scale(.6);opacity:0}}
@keyframes chainB{to{transform:translate(95px,-60px) rotate(40deg) scale(.6);opacity:0}}
@keyframes lockFall{30%{transform:translate(-50%,-70%) rotate(-12deg)}100%{transform:translate(-50%,180%) rotate(35deg);opacity:0}}
.node.born .node-face{animation:born .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes born{0%{transform:scale(.4);filter:brightness(3)}60%{transform:scale(1.18);filter:brightness(1.4)}100%{transform:scale(1)}}
.rays{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;pointer-events:none;z-index:1;
  background:repeating-conic-gradient(from 0deg,rgba(255,236,150,.55) 0 8deg,transparent 8deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);animation:rays 2.4s linear forwards}
@keyframes rays{0%{transform:scale(.2) rotate(0);opacity:0}15%{opacity:1}80%{opacity:.9}100%{transform:scale(1.15) rotate(70deg);opacity:0}}
.flag{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);pointer-events:none;animation:bob 1s ease-in-out infinite;z-index:3}
.flag span{display:block;white-space:nowrap;font-family:var(--f-disp);font-size:16px;color:#5b3000;padding:6px 12px;border-radius:12px;
  background:linear-gradient(#fff2a8,#ffc928);box-shadow:inset 0 -3px 0 #c88600,0 4px 10px rgba(0,0,0,.4)}
.flag::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#ffc928}
@keyframes bob{50%{transform:translate(-50%,-8px)}}
.pulse-ring{position:absolute;inset:-6px;border-radius:50%;border:4px solid #fff;opacity:0;animation:pring 1.6s ease-out infinite;pointer-events:none}
@keyframes pring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.5);opacity:0}}

/* ---------- 스테이지별 지형 ---------- */
.terrain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.biome-tag{position:absolute;z-index:1;pointer-events:none;font-family:var(--f-disp);font-size:13px;letter-spacing:1px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);text-shadow:0 1px 0 rgba(0,0,0,.5);white-space:nowrap}
.t-pulse{animation:tPulse 2.2s ease-in-out infinite alternate}
@keyframes tPulse{from{opacity:.5}to{opacity:1}}
.t-flash{opacity:0;animation:tFlash 6s infinite}
@keyframes tFlash{0%,86%,100%{opacity:0}88%{opacity:1}90%{opacity:.15}92%{opacity:.95}96%{opacity:0}}
.t-fall{animation:tFall 5s linear infinite}
@keyframes tFall{from{transform:translate(0,-20px)}to{transform:translate(-14px,110px)}}
.t-rise{animation:tRise 4s ease-in infinite}
@keyframes tRise{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){.t-pulse,.t-fall,.t-rise{animation:none}.t-flash{animation:none;opacity:0}}

/* ---------- 인게임: 스테이지별 배경 / 타일 재질(내가 고른 타일 모양 · data-m = 타일 모양 번호) ---------- */
.g-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.g-bg svg{position:absolute;inset:0;width:100%;height:100%}
.g-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,6,30,.55),rgba(10,6,30,.28) 42%,rgba(10,6,30,.55))}
:is(#scr-game,.skin-pv)[data-m]{--tr:22%}
#scr-game[data-m]:not(.fever) .board{border-radius:var(--br,26px);background:rgba(8,5,24,.5);box-shadow:inset 0 0 0 3px var(--pp),inset 0 12px 30px rgba(0,0,0,.4),0 0 0 4px rgba(0,0,0,.45),0 18px 40px rgba(0,0,0,.5)}
#scr-game[data-m] .sock{border-radius:var(--tr)}
:is(#scr-game,.skin-pv)[data-m] .tile:not(.clock){border-radius:var(--tr)}
:is(#scr-game,.skin-pv)[data-m] .tile.answer::after{border-radius:inherit}
:is(#scr-game,.skin-pv)[data-m="1"]{--tr:14%;--br:20px}
:is(#scr-game,.skin-pv)[data-m="1"] .tile:not(.clock){background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 2px,transparent 2px 18%),linear-gradient(90deg,var(--cd),var(--c) 30%,var(--cl) 50%,var(--c) 70%,var(--cd));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 3px var(--cdd),0 calc(var(--t) * .05) 0 rgba(0,0,0,.35),0 calc(var(--t) * .1) 0 rgba(0,0,0,.28),0 calc(var(--t) * .16) calc(var(--t) * .12) rgba(0,0,0,.3)}
:is(#scr-game,.skin-pv)[data-m="1"] .tile:not(.clock)::before{left:0;right:0;top:30%;width:auto;height:6%;border-radius:0;background:rgba(0,0,0,.22);transform:none;box-shadow:0 calc(var(--t) * .38) 0 rgba(0,0,0,.22)}
:is(#scr-game,.skin-pv)[data-m="2"]{--tr:36%;--br:34px}
:is(#scr-game,.skin-pv)[data-m="2"] .tile:not(.clock){background:radial-gradient(90% 70% at 35% 22%,var(--cl),var(--c) 55%,var(--cd));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -6px 10px var(--cdd),inset 0 3px 6px rgba(255,255,255,.5),0 6px 0 rgba(0,0,0,.25),0 calc(var(--t) * .1) 0 rgba(0,0,0,.28),0 calc(var(--t) * .16) calc(var(--t) * .12) rgba(0,0,0,.3)}
:is(#scr-game,.skin-pv)[data-m="3"]{--tr:7%;--br:14px}
:is(#scr-game,.skin-pv)[data-m="3"] .tile:not(.clock){background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.18) 0 3px,transparent 4px) 0 0/22% 22%,radial-gradient(circle at 70% 60%,rgba(0,0,0,.22) 0 3px,transparent 4px) 0 0/27% 27%,linear-gradient(135deg,var(--cl),var(--c) 45%,var(--cd));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 4px var(--cd),inset 0 calc(var(--t) * -.09) 0 var(--cdd),0 calc(var(--t) * .06) 0 rgba(0,0,0,.4),0 calc(var(--t) * .1) 0 rgba(0,0,0,.28),0 calc(var(--t) * .16) calc(var(--t) * .12) rgba(0,0,0,.3)}
:is(#scr-game,.skin-pv)[data-m="3"] .tile:not(.clock)::before{left:55%;top:0;width:3px;height:30%;border-radius:0;background:rgba(0,0,0,.3);transform:rotate(18deg)}
:is(#scr-game,.skin-pv)[data-m="4"]{--tr:3%;--br:8px}
:is(#scr-game,.skin-pv)[data-m="4"] .tile:not(.clock){background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 3px,transparent 3px 14%),linear-gradient(var(--cl),var(--c) 40%,var(--cd));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 4px 0 0 rgba(255,255,255,.28),inset -4px 0 0 rgba(0,0,0,.3),0 calc(var(--t) * .07) 0 rgba(0,0,0,.45),0 calc(var(--t) * .1) 0 rgba(0,0,0,.28),0 calc(var(--t) * .16) calc(var(--t) * .12) rgba(0,0,0,.3)}
:is(#scr-game,.skin-pv)[data-m="4"] .tile:not(.clock)::before,:is(#scr-game,.skin-pv)[data-m="7"] .tile:not(.clock)::before,:is(#scr-game,.skin-pv)[data-m="10"] .tile:not(.clock)::before,:is(#scr-game,.skin-pv)[data-m="11"] .tile:not(.clock)::before{display:none}
:is(#scr-game,.skin-pv)[data-m="5"]{--tr:2%;--br:6px}
:is(#scr-game,.skin-pv)[data-m="5"] .tile:not(.clock){background:linear-gradient(145deg,var(--cl) 0 18%,var(--c) 18% 70%,var(--cd));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 3px var(--cdd),inset 0 0 0 6px rgba(255,255,255,.18),0 calc(var(--t) * .06) 0 rgba(0,0,0,.5),0 calc(var(--t) * .1) 0 rgba(0,0,0,.28),0 calc(var(--t) * .16) calc(var(--t) * .12) rgba(0,0,0,.3)}
:is(#scr-game,.skin-pv)[data-m="5"] .tile:not(.clock)::before{left:0;top:0;width:100%;height:100%;border-radius:0;transform:none;background:radial-gradient(circle at 9% 9%,rgba(255,255,255,.75) 0 2.4px,transparent 3px),radial-gradient(circle at 9% 91%,rgba(255,255,255,.75) 0 2.4px,transparent 3px),radial-gradient(circle at 91% 91%,rgba(255,255,255,.75) 0 2.4px,transparent 3px)}
:is(#scr-game,.skin-pv)[data-m="6"]{--tr:11%;--br:22px}
:is(#scr-game,.skin-pv)[data-m="6"] .tile:not(.clock)::before{left:-2%;top:-3%;width:104%;height:26%;border-radius:40% 40% 50% 50%/60% 60% 90% 90%;background:#fff;box-shadow:inset 0 -4px 0 #cfe6ff;transform:none}
:is(#scr-game,.skin-pv)[data-m="6"] .tile .ico{top:27%}
:is(#scr-game,.skin-pv)[data-m="7"]{--tr:3%;--br:6px}

/* ---------- 글로우 · 반짝임 ---------- */
.tiles{overflow:visible;clip-path:inset(-6px -16px -16px -16px)}
.tile:not(.clock){filter:drop-shadow(0 0 calc(var(--t) * .1) color-mix(in srgb,var(--c) 65%,transparent))}
#scr-game{--sp:#fff}
#scr-game[data-m="8"]{--sp:#ffc27a}#scr-game[data-m="9"]{--sp:#fff1a8}#scr-game[data-m="10"]{--sp:#cdd6ff}#scr-game[data-m="11"]{--sp:#fff3b0}
.slot::after{content:"";position:absolute;left:14%;top:16%;width:calc(var(--t) * .17);height:calc(var(--t) * .17);background:var(--sp,#fff);pointer-events:none;z-index:2;opacity:0;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tSpark 3.6s ease-in-out infinite}
.slot:nth-child(3n+2)::after{left:68%;top:62%;animation-delay:-1.2s}
.slot:nth-child(3n)::after{left:46%;top:8%;animation-delay:-2.4s}

.slot:nth-child(5n+3)::after{animation-delay:-3s}

/* ---------- 관리자: 네임플레이트 지정 ---------- */
.plate-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pp-item{padding:6px;border-radius:14px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}

.pp-item.st{box-shadow:0 0 0 3px var(--pink),0 0 12px rgba(255,79,139,.6)}
.pp-main{display:block;width:100%;border:0;padding:0;background:none;cursor:pointer}
.pp-main[disabled]{cursor:default}
.pp-item:not(.on) .pp-main{opacity:.55;filter:grayscale(.6)}
.pp-row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:4px;font-size:13px}
.pp-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-star{flex:none;border:0;border-radius:99px;padding:3px 8px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.14)}
.pp-item.st .pp-star{background:var(--pink)}
.pp-item small{display:block;font-size:11px;color:var(--muted);margin-top:1px}

/* ---------- 테마 결과 화면 · 타일 터짐 ---------- */
.card.themed{isolation:isolate;background:linear-gradient(rgba(12,7,36,.55),rgba(12,7,36,.7)),linear-gradient(var(--ia),var(--ib));box-shadow:inset 0 0 0 3px var(--ip),inset 0 -6px 0 rgba(0,0,0,.25),0 0 34px color-mix(in srgb,var(--ip) 45%,transparent),0 30px 60px rgba(0,0,0,.55)}

.res-deco{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.5}

/* ---------- 게임 화면 ---------- */
.hud{padding:10px 14px 0;display:flex;flex-direction:column;gap:7px;position:relative;z-index:4}

  background:radial-gradient(40% 60% at 20% 100%,rgba(255,90,40,.5),transparent 70%),radial-gradient(40% 60% at 80% 100%,rgba(255,40,140,.45),transparent 70%),radial-gradient(50% 70% at 50% 100%,rgba(255,200,40,.45),transparent 70%)}

  background:radial-gradient(130% 100% at 30% 16%,var(--cl) 0%,var(--c) 46%,var(--cd) 100%);
  box-shadow:inset 0 calc(var(--t) * -.09) 0 var(--cdd),inset 0 3px 0 rgba(255,255,255,.75),inset 0 calc(var(--t) * .06) calc(var(--t) * .09) rgba(255,255,255,.22),inset calc(var(--t) * .03) 0 0 rgba(255,255,255,.2),inset calc(var(--t) * -.03) 0 0 rgba(0,0,0,.16),0 calc(var(--t) * .06) 0 var(--cdd),0 calc(var(--t) * .11) 0 rgba(0,0,0,.3),0 calc(var(--t) * .16) calc(var(--t) * .12) rgba(0,0,0,.32);transition:transform .08s}

.tile:active{transform:scale(.93)}

  text-shadow:0 .09em 0 var(--cdd),.06em .06em 0 var(--cdd),-.06em .06em 0 var(--cdd),0 0 .15em var(--cdd)}

/* ---------- 모달 ---------- */
.modal-root{position:absolute;inset:0;z-index:50;pointer-events:none}

  background:rgba(8,4,26,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadeIn .2s}

  box-shadow:inset 0 0 0 2px rgba(255,255,255,.13),inset 0 -6px 0 rgba(0,0,0,.25),0 30px 60px rgba(0,0,0,.55);animation:cardIn .4s cubic-bezier(.3,1.5,.55,1)}

  background:radial-gradient(circle at 34% 26%,var(--cl) 0 14%,var(--c) 52%,var(--cd));box-shadow:inset 0 -5px 0 var(--cdd),inset 0 3px 0 rgba(255,255,255,.4),0 0 0 4px #fff}

.sp-title{flex:1;min-width:0}

.sp-stars svg{width:46px;height:46px}
.sp-stars svg:nth-child(2){width:56px;height:56px;margin-top:-8px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:rgba(0,0,0,.28);border-radius:14px;padding:9px 6px;text-align:center;line-height:1.15}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{font-weight:400;font-size:19px;font-variant-numeric:tabular-nums}
.reward{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(255,210,63,.1);box-shadow:inset 0 0 0 1px rgba(255,210,63,.35);margin-bottom:14px}
.reward .rw-txt{flex:none;font-size:13px;color:var(--gold);line-height:1.25;width:62px}
.reward .plate{flex:1}
.empty-note{padding:14px;border-radius:14px;background:rgba(255,77,94,.12);box-shadow:inset 0 0 0 1px rgba(255,77,94,.4);color:#ffc2ca;font-size:15px;line-height:1.45;text-align:center;margin-bottom:12px}

/* 결과 */
.res-title{font-family:var(--f-disp);font-size:44px;text-align:center;line-height:1;margin-top:4px;
  background:linear-gradient(#fffbe0,#ffd23f 55%,#ff8a1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #8a3b00)}
.res-stage{text-align:center;color:var(--muted);font-size:16px;margin:4px 0 6px}
.res-stars{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:92px;margin-bottom:6px}
.res-stars .rs{position:relative;width:70px;height:70px}
.res-stars .rs:nth-child(2){width:88px;height:88px}
.res-stars .rs svg{position:absolute;inset:0;width:100%;height:100%}
.res-stars .rs .on{opacity:0;transform:scale(2.4)}
.res-stars .rs.lit .on{animation:stamp .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-30deg)}60%{opacity:1;transform:scale(.88)}100%{opacity:1;transform:scale(1)}}
.res-score{text-align:center;line-height:1;margin-bottom:6px}
.res-score small{font-size:13px;letter-spacing:3px;color:var(--muted)}
.res-score b{display:block;font-family:var(--f-disp);font-weight:400;font-size:50px;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 #3b1d8f}
.new-best{display:block;width:max-content;margin:0 auto 10px;font-family:var(--f-disp);font-size:16px;color:#5b3000;padding:4px 14px;border-radius:99px;background:linear-gradient(#fff2a8,#ffc928);box-shadow:inset 0 -2px 0 #c88600;animation:bump .6s ease-in-out infinite}
.perfect{text-align:center;font-family:var(--f-disp);font-size:20px;letter-spacing:3px;color:var(--mint);text-shadow:0 0 12px rgba(47,227,165,.7);margin-bottom:8px}

/* 보상 */
.reward-card{text-align:center;overflow:visible}
.reward-card .rays{width:420px;height:420px;margin:-210px 0 0 -210px;top:46%;animation:raysLoop 6s linear infinite;z-index:0}
@keyframes raysLoop{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.reward-card>*{position:relative;z-index:1}
.reward-card .plate{margin:22px auto 12px;max-width:330px;animation:plateIn .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes plateIn{0%{transform:perspective(600px) rotateY(540deg) scale(.3);opacity:0}100%{transform:none;opacity:1}}
.reward-card .pname{font-family:var(--f-disp);font-size:24px;color:var(--gold);margin-bottom:16px}

/* 컬렉션 */
.coll{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.coll-item{border:0;background:none;padding:0;cursor:pointer;text-align:center;position:relative}
.coll-item .cond{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.2}
.coll-item.eq .cond{color:var(--mint)}
.coll-item.eq .plate::before{content:"";position:absolute;inset:-4px -3px;border-radius:12px;box-shadow:0 0 0 3px var(--mint),0 0 16px rgba(47,227,165,.6)}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
.skin-item{border:0;background:none;padding:0;cursor:pointer;text-align:center;position:relative;color:inherit}
.skin-item .pv-box{width:78%;margin:0 auto}
.skin-item .cond{display:block;font-size:12px;color:var(--muted);margin-top:8px;line-height:1.25;word-break:keep-all}
.skin-item.eq .cond{color:var(--mint)}
.skin-item.eq .pv-box::after{content:"";position:absolute;inset:-5px;border-radius:20px;box-shadow:0 0 0 3px var(--mint),0 0 16px rgba(47,227,165,.6);pointer-events:none}
.skin-item.locked .pv-box{filter:grayscale(1) brightness(.4)}
.reward-card .skin-box{width:112px;margin:18px auto 12px;animation:plateIn .9s cubic-bezier(.3,1.5,.5,1)}

/* 관리자 */
.adm h3{margin:18px 0 8px;font-family:var(--f-disp);font-weight:400;font-size:19px;color:var(--gold);letter-spacing:.5px}
.adm h3:first-of-type{margin-top:6px}
.adm-note{font-size:13px;color:var(--muted);line-height:1.45;margin:0 0 8px}
.adm-list{display:flex;flex-direction:column;gap:6px}
.adm-row{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:14px;background:rgba(0,0,0,.25)}
.adm-row .nm{flex:1;min-width:0;font-size:17px}
.adm-row .ct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.adm-row .ct.zero{color:#ff8a9a}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:11px;padding:10px 4px;font-size:15px;background:none;cursor:pointer;color:var(--muted);line-height:1.2}
.seg button.on{background:linear-gradient(#7c5cff,#5a3be0);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.seg button small{display:block;font-size:11px;opacity:.8}
.ta{width:100%;min-height:260px;border-radius:16px;border:0;outline:none;padding:12px 14px;font-size:17px;line-height:1.55;color:#fff;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);resize:vertical}
.ta:focus{box-shadow:inset 0 0 0 3px var(--gold)}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:6px 0 16px}
.pin-dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.15);box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
.pin-dots i.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.pin-dots.err{animation:wrong .4s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pad .btn{font-size:24px;padding:14px 0}
.toast{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;max-width:90%;padding:11px 18px;border-radius:16px;
  background:rgba(20,12,60,.95);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15),0 10px 30px rgba(0,0,0,.5);font-size:16px;text-align:center;animation:toast 2.6s ease forwards;pointer-events:none}
@keyframes toast{0%{transform:translate(-50%,-20px);opacity:0}8%{transform:translate(-50%,0);opacity:1}85%{opacity:1}100%{opacity:0}}
.countdown{font-family:var(--f-disp);font-size:72px;color:#fff;text-align:center;line-height:1;margin-top:8px;animation:bump .5s}
.answer-box{font-family:var(--f-disp);font-size:28px;color:var(--gold);text-align:center;padding:12px;border-radius:16px;box-shadow:inset 0 0 0 2px var(--gold);margin:10px 0;word-break:keep-all}

/* ---------- 저장 / 불러오기 / 튜토리얼 ---------- */
.save-ok{width:96px;height:96px;margin:2px auto 8px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 26%,#9dffd9 0 12%,#2fe3a5 52%,#0f9e72);box-shadow:inset 0 -6px 0 #0b6d50,inset 0 4px 0 rgba(255,255,255,.5),0 0 0 5px #fff,0 0 30px rgba(47,227,165,.65);animation:okPop .6s cubic-bezier(.3,1.7,.5,1)}
.save-ok svg{width:54px;height:54px}
.save-ok path{stroke-dasharray:40;stroke-dashoffset:40;animation:okDraw .45s .3s ease-out forwards}
@keyframes okPop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes okDraw{to{stroke-dashoffset:0}}
.file-chip{display:block;margin:0 auto 12px;max-width:100%;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.35);font-size:14px;color:var(--gold);text-align:center;word-break:break-all;box-shadow:inset 0 0 0 1px rgba(255,210,63,.3)}
.sum-line{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.25);font-size:16px;margin-bottom:6px}
.sum-line span{color:var(--muted)}
.code-box{width:100%;min-height:84px;border-radius:14px;border:0;outline:none;padding:10px 12px;font-size:13px;line-height:1.4;color:#fff;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);resize:vertical;word-break:break-all}
.tut-img{position:relative;border-radius:18px;overflow:hidden;background:#0b0620;box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),0 8px 20px rgba(0,0,0,.4);margin-bottom:12px}
.tut-img img{display:block;width:100%;height:auto;max-height:46vh;object-fit:contain;margin:0 auto}
.tut-step{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tut-no{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:20px;color:#5b3000;background:linear-gradient(#fff2a8,#ffc928);box-shadow:inset 0 -3px 0 #c88600}
.tut-step b{font-family:var(--f-disp);font-weight:400;font-size:21px;line-height:1.15}
.tut-txt{font-size:15.5px;line-height:1.5;color:#e4defa;margin:0 0 12px;min-height:4.6em;word-break:keep-all}
.tut-dots{display:flex;justify-content:center;gap:8px;margin:0 0 12px}
.tut-dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}
.tut-dots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold);transform:scale(1.25)}
/* ---------- 관리자: 색 ---------- */
.pv-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 12px}
.pv-box{position:relative;aspect-ratio:1/1}
.pv-box .tile{position:absolute;inset:0;padding:8% 4%;cursor:default;animation:none!important}
.pal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pal-btn{border:0;cursor:pointer;border-radius:14px;padding:9px 10px;text-align:left;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 2px transparent;color:#fff;font-size:15px;line-height:1.2}
.pal-btn.on{box-shadow:inset 0 0 0 3px var(--gold);background:rgba(255,210,63,.12)}
.pal-dots{display:flex;gap:4px;margin-top:6px}
.pal-dots i{flex:1;height:14px;border-radius:7px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.cust-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cust-row>b{flex:none;width:62px;font-weight:400;font-size:14px;line-height:1.2}
.cust-sw{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.sw{width:24px;height:24px;border-radius:8px;border:0;padding:0;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.sw.on{outline:3px solid #fff;outline-offset:1px}
.cust-row input[type=color]{flex:none;width:34px;height:34px;border:0;padding:0;border-radius:10px;background:none;cursor:pointer}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-btn{border:0;cursor:pointer;border-radius:14px;padding:0;overflow:hidden;color:#fff;font-size:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.theme-btn.on{box-shadow:0 0 0 3px var(--gold)}
.theme-btn i{display:block;height:44px}
.theme-btn span{display:block;padding:5px 2px 6px;background:rgba(0,0,0,.35)}
.seal-tag{font-size:11px;color:#2fe3a5;margin-left:4px}

/* ---------- 피버 강화 ---------- */
.fever-vig{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5;transition:opacity .25s;
  box-shadow:inset 0 0 50px 14px rgba(255,120,40,.9),inset 0 0 130px 36px rgba(255,40,150,.6)}
.fever .fever-vig{opacity:1;animation:vigPulse .35s ease-in-out infinite alternate}
@keyframes vigPulse{to{box-shadow:inset 0 0 70px 22px rgba(255,210,60,.95),inset 0 0 170px 54px rgba(255,60,200,.7)}}
.fever-bg{height:80%}
.fever .fever-bg{animation:flame2 .3s ease-in-out infinite alternate}
@keyframes flame2{to{transform:scaleY(1.2) scaleX(1.05);transform-origin:bottom;filter:hue-rotate(25deg) brightness(1.3)}}
.fever .board{box-shadow:inset 0 0 0 4px rgba(255,235,120,1),inset 0 12px 30px rgba(0,0,0,.35),0 0 44px rgba(255,120,40,.95),0 0 100px rgba(255,50,150,.7)}
.fever .tile:not(.pop):not(.wrong):not(.hint):not(.answer):not(.clock){filter:saturate(1.7) brightness(1.18) drop-shadow(0 0 9px rgba(255,220,100,.9));animation:tileJig .34s ease-in-out infinite alternate}
@keyframes tileJig{0%{transform:scale(1) rotate(-1.6deg)}100%{transform:scale(1.06) rotate(1.6deg)}}
.fever .cpop b{font-size:82px}
.fever-flash{position:absolute;inset:0;z-index:30;pointer-events:none;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.95),rgba(255,200,60,.7) 40%,rgba(255,60,140,0) 75%);animation:fflash .6s ease-out forwards}
@keyframes fflash{from{opacity:1}to{opacity:0}}
.banner.fever b{font-size:76px}
@media (prefers-reduced-motion:reduce){.fever-vig,.fever .fever-bg,.fever .tile{animation:none!important}}
.mv-row{padding:10px;border-radius:14px;background:rgba(0,0,0,.25);margin-top:8px}
.mv-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mv-top b{flex:1;min-width:0;font-weight:400;font-size:17px}
.mv-dot{flex:none;width:24px;height:24px;border-radius:8px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4)}
@media (prefers-reduced-motion:reduce){
  #app.shake{animation:none}.flag,.tile.hint,.tile.clock,.fever .board,.fever .fever-bg,.new-best{animation:none}
  body::after{animation:none}
}

/* ---------- 시작 화면: 우주 배경 + 아케이드 동전 투입 ---------- */
#scr-title{z-index:40;background:radial-gradient(120% 70% at 50% 108%,#2a1170 0,#12073a 45%,#05030f 100%);overflow:hidden}
#scr-title.out{pointer-events:none;animation:ttOut .65s ease-in forwards}
@keyframes ttOut{to{opacity:0;transform:scale(1.14)}}
.sp-sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sp-warp{position:absolute;inset:0;transform-origin:50% 100%;animation:spWarp 2.4s cubic-bezier(.08,.75,.2,1) both}
@keyframes spWarp{from{transform:translateY(-34%) scaleY(2.6);opacity:0}25%{opacity:1}to{transform:none;opacity:1}}
.sp-layer{position:absolute;left:0;right:0;top:0;height:200%;animation:spDrift var(--sp,60s) linear infinite}
@keyframes spDrift{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.sp-layer i{position:absolute;border-radius:50%;background:#fff;animation:spTw 3s ease-in-out infinite alternate}
.sp-layer i:nth-child(5n){background:#ffe9a8}.sp-layer i:nth-child(7n){background:#cfe6ff}
@keyframes spTw{from{opacity:.25}to{opacity:1}}
.sp-neb{position:absolute;inset:0;
  background:radial-gradient(55% 30% at 18% 22%,rgba(150,70,255,.42),transparent 70%),radial-gradient(45% 28% at 88% 48%,rgba(255,70,160,.30),transparent 70%),radial-gradient(60% 34% at 40% 72%,rgba(40,150,255,.26),transparent 72%)}
.sp-planet{position:absolute;right:-46px;top:-34px;width:150px;height:150px;animation:spFloat 9s ease-in-out infinite alternate}
@keyframes spFloat{to{transform:translateY(14px) rotate(2deg)}}
.sp-ball{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffc2e0 0,#c96bff 36%,#5a2fb8 70%,#1d0f52 100%);box-shadow:inset -20px -15px 34px rgba(10,4,40,.8),0 0 46px rgba(170,90,255,.38)}
.sp-ring{position:absolute;left:-36%;right:-36%;top:41%;height:20%;border-radius:50%;border:5px solid rgba(255,222,150,.6);transform:rotate(-17deg);box-shadow:0 0 14px rgba(255,200,120,.35)}
.sp-ring.front{clip-path:inset(52% 0 0 0)}
.sp-ring.back{border-color:rgba(255,222,150,.28)}
.sp-moon{position:absolute;left:9%;top:6%;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0,#bcd3ff 40%,#5d6fb5 100%);box-shadow:inset -8px -6px 14px rgba(8,6,40,.7),0 0 18px rgba(160,190,255,.35);animation:spFloat 7s ease-in-out infinite alternate-reverse}
.sp-shoot{position:absolute;width:110px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:spShoot 6.5s linear infinite}
.sp-shoot.s1{left:88%;top:8%;animation-delay:3s}
.sp-shoot.s2{left:70%;top:30%;animation-delay:6.2s;animation-duration:8s}
@keyframes spShoot{0%{opacity:0;transform:translate(0,0) rotate(150deg)}2%{opacity:1}12%{opacity:0;transform:translate(-320px,185px) rotate(150deg)}100%{opacity:0}}

.tt-main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 0;text-align:center}
.tt-title{display:flex;flex-direction:column;align-items:center;line-height:1}
.tt-title span{display:block;font-family:var(--f-disp);font-weight:400;white-space:nowrap;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:ttRise 1.6s cubic-bezier(.16,.9,.24,1) both}
.tt-l1{font-size:clamp(48px,16vw,80px);letter-spacing:2px;background-image:linear-gradient(#fffbe0,#ffd23f 50%,#ff8a1c);filter:drop-shadow(0 5px 0 #8a3b00) drop-shadow(0 0 26px rgba(255,180,40,.55));animation-delay:.35s!important}
.tt-l2{margin-top:10px;font-size:clamp(42px,13.5vw,66px);letter-spacing:3px;background-image:linear-gradient(#f2fffb,#6af0ff 50%,#2f8dff);filter:drop-shadow(0 4px 0 #0c3a86) drop-shadow(0 0 24px rgba(70,184,255,.55));animation-delay:.85s!important}
@keyframes ttRise{0%{opacity:0;transform:translateY(72vh) scale(.5)}45%{opacity:1}78%{transform:translateY(-12px) scale(1.04)}100%{opacity:1;transform:none}}
.tt-tag{font-family:var(--f-disp);font-size:20px;letter-spacing:6px;padding:7px 18px 7px 24px;border-radius:99px;color:#fff;
  background:rgba(255,79,139,.16);box-shadow:inset 0 0 0 2px #ff4f8b,0 0 18px rgba(255,79,139,.55);text-shadow:0 0 10px #ff4f8b;
  opacity:0;animation:ttRise2 1s 1.55s cubic-bezier(.2,1.2,.3,1) both}
@keyframes ttRise2{from{opacity:0;transform:translateY(40px) scale(.8)}to{opacity:1;transform:none}}

.tt-bottom{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 20px calc(22px + env(safe-area-inset-bottom,0px));opacity:0;animation:ttPanel 1.1s 2s cubic-bezier(.2,1.1,.3,1) both}
@keyframes ttPanel{from{opacity:0;transform:translateY(90px)}to{opacity:1;transform:none}}
.tt-who{min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;font-size:17px;padding:6px 18px;border-radius:16px;background:rgba(0,0,0,.34);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:6px}
.tt-who b{font-weight:400;color:var(--gold)}.tt-who small{font-size:13px;color:var(--muted)}
.tt-insert{font-family:var(--f-disp);font-size:30px;letter-spacing:5px;color:#fff;text-shadow:0 0 8px #ff4f8b,0 0 24px #ff4f8b;animation:ttBlink 1.1s steps(1) infinite}
@keyframes ttBlink{50%{opacity:.18}}
.tt-insert.ok{animation:bump .45s;color:#e6fff6;text-shadow:0 0 8px #2fe3a5,0 0 26px #2fe3a5}
.coin-slot{position:relative;width:136px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(#2d2856,#120f2d);
  box-shadow:inset 0 0 0 3px #4d4688,inset 0 5px 9px rgba(0,0,0,.6),0 0 20px rgba(255,210,63,.22)}
.coin-slot::before{content:"";width:72px;height:8px;border-radius:5px;background:#000;box-shadow:0 0 0 2px #7168b8,inset 0 2px 3px #000}
.coin-slot.hit{animation:slotHit .6s}
@keyframes slotHit{0%{box-shadow:inset 0 0 0 3px #ffe680,inset 0 5px 9px rgba(0,0,0,.6),0 0 46px 8px rgba(255,210,63,.95)}100%{box-shadow:inset 0 0 0 3px #4d4688,inset 0 5px 9px rgba(0,0,0,.6),0 0 20px rgba(255,210,63,.22)}}
.coin{position:relative;width:84px;height:84px;margin-top:26px;border:0;padding:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#fff6b0 0 14%,#ffd23f 48%,#d99200 100%);
  box-shadow:inset 0 -6px 0 #a96400,inset 0 3px 0 rgba(255,255,255,.7),0 0 0 4px #ffe680,0 8px 0 4px rgba(0,0,0,.35),0 0 30px rgba(255,210,63,.55);animation:coinBob 1.2s ease-in-out infinite}
.coin::before{content:"";position:absolute;inset:9px;border-radius:50%;border:3px dashed rgba(138,75,0,.5)}
.coin span{position:relative;font-family:var(--f-disp);font-size:30px;line-height:1;color:#8a4b00;text-shadow:0 1px 0 rgba(255,255,255,.75)}
.coin:focus-visible{outline:3px solid #fff;outline-offset:6px}
.coin{touch-action:none;cursor:grab;z-index:3}
.coin.drag{animation:none;transition:none;cursor:grabbing;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
.coin.drag.back{transition:transform .32s cubic-bezier(.3,1.6,.5,1)}
.coin.drag.in{transition:transform .26s ease-in,opacity .26s ease-in}
.coin-slot.near{box-shadow:inset 0 0 0 3px #ffe680,inset 0 5px 9px rgba(0,0,0,.6),0 0 34px 4px rgba(255,210,63,.85);animation:slotNear .5s ease-in-out infinite alternate}
@keyframes slotNear{to{transform:scale(1.06)}}
@keyframes coinBob{50%{transform:translateY(-8px)}}
.coin.go{pointer-events:none;animation:coinGo .56s cubic-bezier(.5,0,.8,.7) forwards}
@keyframes coinGo{0%{transform:perspective(420px) translateY(0) rotateY(0)}75%{transform:perspective(420px) translateY(-100px) rotateY(540deg)}100%{transform:perspective(420px) translateY(-122px) rotateY(720deg) scale(.5,.3);opacity:0}}
.tt-hint{font-size:15px;color:var(--muted);min-height:20px}
.tt-credit{font-family:var(--f-disp);font-size:15px;letter-spacing:3px;color:var(--gold);opacity:.9}
.tt-credit b{font-weight:400;display:inline-block}
.mv-row.my{display:flex;align-items:center;gap:10px}
.my-prev{flex:none;width:72px}
.my-ctl{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.my-ctl .cust-sw{flex:none}
@media (max-height:640px){.tt-main{gap:8px}.coin{margin-top:14px;width:72px;height:72px}.tt-who{min-height:38px;margin-bottom:0}.tt-insert{font-size:26px}}
@media (prefers-reduced-motion:reduce){
  .sp-warp,.sp-layer,.sp-layer i,.sp-planet,.sp-moon,.sp-shoot,.tt-insert,.coin{animation:none!important}
  .tt-title span,.tt-tag,.tt-bottom{animation:none!important;opacity:1}
  .tt-title span{opacity:1}
  #scr-title.out{animation:none;opacity:0}
}
</style>

<script id="hunt-js">
/* [타일 헌트] 이 타일 게임 안에서 바로 열려요 · 끝말잇기의 몬스터·장비·드롭·큐브·변신·동료·경험치를 그대로 같이 써요
   (같은 깃허브 주소 안의 끝말잇기 게임을 화면 가득 불러와요 · 저장 공간이 같아서 아이템도 함께) */
addEventListener('DOMContentLoaded', function(){
  function wcUrl(){ try{ var s = JSON.parse(localStorage.getItem('jd_share') || 'null'); if(s && s.page) return s.page + '#tho'; if(s && s.base) return s.base.replace(/dlx[-\/]$/, '') + 'index.html#tho'; }catch(e){} return null; }
  function open(){
    var u = wcUrl(); if(!u){ alert('끝말잇기 게임을 이 폰에서 한 번 먼저 켜 주세요.\n그 다음부터 여기서 타일 헌트를 할 수 있어요.'); return; }
    var o = document.getElementById('hunt-ov'); if(o) o.remove();
    o = document.createElement('div'); o.id = 'hunt-ov';
    o.innerHTML = '<iframe src="' + u + '" allow="autoplay; fullscreen" title="타일 헌트"></iframe><button type="button" id="hunt-x">✕ 타일 게임으로</button>';
    document.body.appendChild(o);
    o.querySelector('#hunt-x').onclick = function(){ if(confirm('타일 헌트를 닫을까요? (얻은 보상은 이미 저장돼 있어요)')) o.remove(); };
    try{ if(typeof bgmStopAll === 'function') bgmStopAll(); }catch(e){}
  }
  var b = document.createElement('button'); b.id = 'btn-hunt'; b.type = 'button'; b.innerHTML = '⚔ 타일 헌트'; b.onclick = open;
  document.body.appendChild(b);
});
</script>

const HEX6 = /^#[0-9a-f]{6}$/i;
function activePalette(cfg){
  cfg = cfg || getCfg();
  if(cfg.pal === 'custom' && Array.isArray(cfg.custom) && cfg.custom.length === 6 && cfg.custom.every(c => HEX6.test(c))) return cfg.custom;
  return (PALETTES.find(p => p.id === cfg.pal) || PALETTES[0]).c;

function hashName(str){ let h = 7; for(const ch of str) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h; }
function tileColor(name, cfg){
  cfg = cfg || getCfg(); const pal = activePalette(cfg);
  const mc = cfg.moveColors && cfg.moveColors[norm(name)]; if(mc && HEX6.test(mc)) return mc;
  if(cfg.tileMode === 'one') return pal[0];
  if(cfg.tileMode === 'mix') return pal[hashName(norm(name)) % 6];
  return pal[TYPE_SLOT[moveType(name)]];
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).replace(/\s+/g, '');
const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function mix(hex, amt){ // amt>0 밝게, <0 어둡게
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return `rgb(${r},${g},${b})`;
}
function colorVars(c){ return `--c:${c};--cl:${mix(c,.55)};--cd:${mix(c,-.28)};--cdd:${mix(c,-.5)}`; }
function fitK(name){ // 타일 안에 단어가 잘리지 않게 글자 크기(타일 대비 비율) 계산
  const words = String(name).trim().split(/\s+/);
  for(let k = .27; k > .09; k -= .005){

/* ================= 스테이지별 지형 (뒤로 갈수록 험준해져요) ================= */
const BIOMES = [
  {n:'도장 앞마당',e:'🌿',a:'#3f9a5c',b:'#256b43',p:'#e6c98a',k:'grass'},
  {n:'대나무 숲',e:'🎋',a:'#2f9468',b:'#1b6a4c',p:'#d8cb94',k:'bamboo'},
  {n:'물안개 시내',e:'🌊',a:'#2b86a8',b:'#1b5d80',p:'#cdeaf3',k:'river'},
  {n:'바위 언덕',e:'🪨',a:'#8a7358',b:'#5e4b3a',p:'#dcc7a6',k:'rock'},
  {n:'낭떠러지 길',e:'⛰️',a:'#8b5e48',b:'#5a3a2c',p:'#e8bf9a',k:'cliff'},
  {n:'가시 협곡',e:'☠️',a:'#6a3f5a',b:'#3e2036',p:'#d8b0c4',k:'spike'},
  {n:'눈보라 설산',e:'🏔️',a:'#8fb4d6',b:'#5a82aa',p:'#ffffff',k:'snow'},
  {n:'얼음 절벽',e:'🧊',a:'#59c6ea',b:'#2a82b4',p:'#e6fbff',k:'ice'},
  {n:'불타는 화산',e:'🌋',a:'#6a2018',b:'#34100c',p:'#ff9a3c',k:'lava'},
  {n:'금강 수정굴',e:'💎',a:'#43307a',b:'#1f1443',p:'#ffd23f',k:'crystal'},
  {n:'번개 치는 태백',e:'⚡',a:'#2f3858',b:'#141a30',p:'#9fb4ff',k:'storm'},
  {n:'마지막 정상',e:'👑',a:'#7a3a7a',b:'#3a1a4a',p:'#ffd23f',k:'summit'}
];
const tRng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const tf = n => n.toFixed(1), tR = (r, a, b) => a + r() * (b - a);
const tPoly = (pts, fill, op, cls) => `<polygon points="${pts.map(q => tf(q[0]) + ',' + tf(q[1])).join(' ')}" fill="${fill}"${op != null ? ` opacity="${op}"` : ''}${cls ? ` class="${cls}"` : ''}/>`;
const tPeak = (x, y, w, h, c, cap) => {
  const t = x + w * .08;
  let s = tPoly([[x - w / 2, y], [t, y - h], [x + w / 2, y]], c) + tPoly([[t, y - h], [x + w / 2, y], [t - w * .06, y]], '#000', .28);
  if(cap) s += tPoly([[t, y - h], [t - w * .17, y - h * .72], [t - w * .05, y - h * .78], [t + w * .02, y - h * .68], [t + w * .1, y - h * .76], [t + w * .17, y - h * .72]], cap);
  return s;
};
const TPROP = {
  grass:(x, y, r) => r() < .35 ? `<circle cx="${tf(x)}" cy="${tf(y)}" r="${tf(tR(r, 7, 12))}" fill="#1e6a40"/><circle cx="${tf(x - 3)}" cy="${tf(y - 3)}" r="${tf(tR(r, 4, 7))}" fill="#46b06a"/>` : `<path d="M${tf(x)} ${tf(y)}l-5 -9M${tf(x)} ${tf(y)}l0 -13M${tf(x)} ${tf(y)}l5 -9" stroke="#8ceb95" stroke-width="2.4" stroke-linecap="round" fill="none"/>`,
  bamboo:(x, y, r) => { const h = tR(r, 34, 62); return `<path d="M${tf(x)} ${tf(y)}V${tf(y - h)}" stroke="#9be8a8" stroke-width="4" stroke-linecap="round"/><path d="M${tf(x - 3)} ${tf(y - h * .35)}h6M${tf(x - 3)} ${tf(y - h * .7)}h6" stroke="#2c7d52" stroke-width="2"/><path d="M${tf(x)} ${tf(y - h)}q10 -4 14 4M${tf(x)} ${tf(y - h * .6)}q-10 -4 -14 4" stroke="#c5f5c8" stroke-width="2.4" fill="none" stroke-linecap="round"/>`; },
  river:(x, y, r) => r() < .6 ? `<path d="M${tf(x)} ${tf(y)}q6 -6 12 0t12 0t12 0" stroke="#d6f3ff" stroke-width="2.4" fill="none" opacity=".6" stroke-linecap="round"/>` : `<ellipse cx="${tf(x)}" cy="${tf(y)}" rx="${tf(tR(r, 7, 13))}" ry="6" fill="#7e93a0"/><ellipse cx="${tf(x - 2)}" cy="${tf(y - 2)}" rx="5" ry="2.5" fill="#b9c9d2"/>`,
  rock:(x, y, r) => { const s = tR(r, 9, 18); return tPoly([[x - s, y], [x - s * .7, y - s * .8], [x, y - s * 1.1], [x + s * .8, y - s * .6], [x + s, y]], '#a38a6b') + tPoly([[x, y - s * 1.1], [x + s * .8, y - s * .6], [x + s, y], [x + s * .1, y]], '#000', .25); },
  cliff:(x, y, r) => tPeak(x, y, tR(r, 38, 66), tR(r, 38, 78), '#b58260'),
  spike:(x, y, r) => { let s = ''; const n = 3 + (r() * 3 | 0); for(let k = 0; k < n; k++){ const h = tR(r, 16, 38), xx = x + k * 7 - n * 3; s += tPoly([[xx - 4, y], [xx + r() * 3, y - h], [xx + 4, y]], '#2a1226') + tPoly([[xx - 1.5, y - h * .7], [xx + r() * 2, y - h], [xx + 1.5, y - h * .7]], '#ff7aa8'); } return s; },
  snow:(x, y, r) => tPeak(x, y, tR(r, 44, 76), tR(r, 46, 88), '#7ea3c8', '#fff'),
  ice:(x, y, r) => { const h = tR(r, 24, 54), w = tR(r, 9, 15); return tPoly([[x, y - h], [x + w, y - h * .45], [x + w * .6, y], [x - w * .6, y], [x - w, y - h * .45]], '#c4f6ff', .85) + `<path d="M${tf(x)} ${tf(y - h)}L${tf(x - w * .2)} ${tf(y)}" stroke="#fff" stroke-width="1.6" opacity=".8"/>`; },
  lava:(x, y, r) => r() < .5 ? tPeak(x, y, tR(r, 34, 60), tR(r, 34, 66), '#1d0b09') + `<path d="M${tf(x)} ${tf(y - 4)}l-3 -12l5 -10" stroke="#ff8a2a" stroke-width="2.2" fill="none" class="t-pulse"/>` : `<path d="M${tf(x)} ${tf(y)}l8 -6l-3 -8l9 -6l-2 -10" stroke="#ff7a1c" stroke-width="3" fill="none" stroke-linecap="round" class="t-pulse" style="filter:drop-shadow(0 0 4px #ff5a00)"/>`,
  crystal:(x, y, r) => { const h = tR(r, 22, 50), w = tR(r, 8, 14), c = r() < .3 ? '#ffd23f' : '#a58bff'; return tPoly([[x, y - h], [x + w, y - h * .4], [x, y], [x - w, y - h * .4]], c, .9, 't-pulse') + tPoly([[x, y - h], [x + w, y - h * .4], [x, y]], '#fff', .22); },
  storm:(x, y, r) => tPeak(x, y, tR(r, 40, 72), tR(r, 52, 100), '#1a2140') + `<path d="M${tf(x - 4)} ${tf(y - 6)}l6 -16" stroke="#aebdff" stroke-width="1.4" opacity=".6"/>`,
  summit:(x, y, r) => tPeak(x, y, tR(r, 42, 72), tR(r, 48, 92), '#d9a23a', '#fff3b0')
};
const TFX = {   // 스테이지마다 한 번 얹는 움직이는 효과
  snow:(W, yT, yB, r) => { let s = ''; for(let k = 0; k < 16; k++) s += `<circle class="t-fall" cx="${tf(r() * W)}" cy="${tf(tR(r, yT, yB - 60))}" r="${tf(tR(r, 1.4, 2.8))}" fill="#fff" opacity=".85" style="animation-delay:-${tf(r() * 5)}s"/>`; return s; },
  ice:(W, yT, yB, r) => TFX.snow(W, yT, yB, r),
  lava:(W, yT, yB, r) => { let s = ''; for(let k = 0; k < 12; k++) s += `<circle class="t-rise" cx="${tf(r() * W)}" cy="${tf(tR(r, yT + 30, yB))}" r="${tf(tR(r, 1.5, 3))}" fill="#ffa23c" style="animation-delay:-${tf(r() * 4)}s"/>`; return s; },
  storm:(W, yT) => [.2, .82].map((u, k) => { const x = W * u; return `<polyline class="t-flash" points="${tf(x)},${tf(yT + 6)} ${tf(x - 9)},${tf(yT + 36)} ${tf(x + 2)},${tf(yT + 40)} ${tf(x - 11)},${tf(yT + 80)}" stroke="#fff" stroke-width="3" fill="none" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px #9fb4ff);animation-delay:-${k * 2.7}s"/>`; }).join(''),
  summit:(W, yT, yB) => `<ellipse class="t-pulse" cx="${tf(W / 2)}" cy="${tf(yT + 20)}" rx="${tf(W * .42)}" ry="46" fill="#ffd23f" opacity=".28" style="filter:blur(14px)"/>`
};
function terrainHTML(pts, W, H){
  const top = i => i >= 11 ? 0 : (pts[i].y + pts[i + 1].y) / 2, bot = i => i <= 0 ? H : (pts[i].y + pts[i - 1].y) / 2;
  const pathX = y => { for(let k = 1; k < pts.length; k++){ const q = pts[k - 1], p = pts[k]; if(y <= q.y && y >= p.y){ const t = (q.y - y) / (q.y - p.y); return q.x + (p.x - q.x) * (3 * t * t - 2 * t * t * t); } } return W / 2; };
  let defs = '', out = '';
  for(let i = 11; i >= 0; i--){   // 위쪽 구간부터 그려서, 아래 구간의 들쭉날쭉한 능선이 위를 덮어요
    const B = BIOMES[i], r = tRng(i * 977 + 13), yT = top(i), yB = bot(i), amp = 3 + i * 1.7;
    defs += `<linearGradient id="tb${i}" gradientUnits="userSpaceOnUse" x1="0" y1="${tf(yT)}" x2="0" y2="${tf(yB)}"><stop offset="0" stop-color="${B.a}"/><stop offset="1" stop-color="${B.b}"/></linearGradient>`;
    let e = `0,${tf(H)}`;
    for(let x = 0; x <= W + 18; x += 18){ const j = i < 4 ? (r() - .5) * amp * 2 : ((x / 18 | 0) % 2 ? -1 : .35) * amp * (.6 + r() * .8); e += ` ${Math.min(x, W)},${tf(yT + j)}`; }
    out += `<polygon points="${e} ${W},${tf(H)}" fill="url(#tb${i})"/>`;
    for(let k = 0; k < 8 + i; k++){
      let x, y, t = 0;
      do{ x = 14 + r() * (W - 28); y = yT + 16 + r() * (yB - yT - 24); t++; }while(Math.abs(x - pathX(y)) < 46 && t < 6);
      if(Math.abs(x - pathX(y)) >= 46) out += TPROP[B.k](x, y, r);
    }
    if(TFX[B.k]) out += TFX[B.k](W, yT, yB, r);
  }
  return `<svg class="terrain" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs>${defs}</defs>${out}</svg>`;
}
function biomeTags(pts, W){
  return pts.map((p, i) => `<span class="biome-tag" style="top:${Math.round(p.y - 60)}px;${p.x < W / 2 ? 'right' : 'left'}:10px">${BIOMES[i].e} ${BIOMES[i].n}</span>`).join('');
}
function renderMap(){
  renderHeader();
  const inner = $('#map-inner'), W = inner.clientWidth || 360;
  const SP = 132, TOP = 120, BOT = 150, GAP = 96;
  const H = TOP + BOT + SP * 11 + GAP;
  inner.style.height = H + 'px';
  const vis = pendingUnlock != null ? pendingUnlock - 1 : progress.unlocked;
  const pts = STAGES.map((s, i) => ({ x:Math.round(W * (.5 + .27 * Math.sin(i * 1.15 + .3))), y:H - BOT - i * SP - (i >= 8 ? GAP : 0) }));
  mapGeom = { pts, H };
  const pathD = pts.reduce((d, p, i) => {
    if(i === 0) return `M${p.x} ${p.y}`;
    const q = pts[i - 1], my = (q.y + p.y) / 2;
    return d + ` C${q.x} ${my} ${p.x} ${my} ${p.x} ${p.y}`;
  }, '');
  const prog = pts.slice(0, vis + 1).reduce((d, p, i, arr) => {
    if(i === 0) return `M${p.x} ${p.y}`; const q = arr[i - 1], my = (q.y + p.y) / 2;
    return d + ` C${q.x} ${my} ${p.x} ${my} ${p.x} ${p.y}`;
  }, '');
  const divY = (pts[7].y + pts[8].y) / 2;
  const pg = pts.map((p, i) => `<stop offset="${((H - p.y) / H).toFixed(4)}" stop-color="${BIOMES[i].p}"/>`).join('');
  let html = terrainHTML(pts, W, H) + `<svg class="map-path" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="pathg" gradientUnits="userSpaceOnUse" x1="0" y1="${H}" x2="0" y2="0">${pg}</linearGradient></defs>
      <path d="${pathD}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="22" stroke-linecap="round"/>
      <path d="${pathD}" fill="none" stroke="url(#pathg)" stroke-width="7" stroke-dasharray="2 15" stroke-linecap="round" opacity=".9"/>
      <path id="prog-path" d="${prog}" fill="none" stroke="#ffd23f" stroke-width="7" stroke-dasharray="2 16" stroke-linecap="round" style="filter:drop-shadow(0 0 6px rgba(255,210,63,.8))"/>
    </svg>
    <div class="zone" style="top:${H - 70}px"><span class="zone-label">태극 품새</span></div>
    <div class="zone" style="top:${divY - 30}px"><div class="belt"><span>유단자 품새</span></div></div>
    <div class="zone" style="top:24px"><span class="zone-label">품새 마스터까지!</span></div>`;
  STAGES.forEach((s, i) => {
    const p = pts[i], rec = progress.records[i], locked = i > vis, stars = rec ? rec.stars : 0;
    const isFront = i === vis && !rec && !locked;
    html += `<button class="node ${locked ? 'locked' : ''}" data-i="${i}" style="left:${p.x}px;top:${p.y}px;${colorVars(s.color)}" aria-label="${s.key}${locked ? ' (잠김)' : ''}">
      <span class="node-glow"></span>${isFront ? '<span class="pulse-ring"></span><span class="flag"><span>도전!</span></span>' : ''}
      <span class="node-face"><small>${s.sub}</small><b>${s.short}</b></span>
      <span class="chain a"></span><span class="chain b"></span>${LOCK_SVG}
      ${!locked ? `<span class="node-stars">${[0,1,2].map(k => starSVG(k < stars)).join('')}</span>` : ''}
    </button>`;
  });
  html += biomeTags(pts, W);
  inner.innerHTML = html;
  inner.querySelectorAll('.node').forEach(n => n.addEventListener('click', () => onNode(+n.dataset.i, n)));
}
function scrollMapTo(i, smooth){
  if(!mapGeom) return; const sc = $('#map-scroll');
  const y = mapGeom.pts[Math.max(0, Math.min(11, i))].y - sc.clientHeight * .55;
  sc.scrollTo({ top:Math.max(0, y), behavior:smooth ? 'smooth' : 'auto' });
}
function onNode(i, el){
  const vis = pendingUnlock != null ? pendingUnlock - 1 : progress.unlocked;
  if(i > vis){
    SFX.locked(); el.classList.remove('rattle'); void el.offsetWidth; el.classList.add('rattle');
    toast(`<b style="color:var(--gold)">${STAGES[i - 1].key}</b>를 먼저 클리어하면 열려요`);
    return;
  }
  SFX.click(); openStagePopup(i);
}
function goMap(){
  stopGameLoop(); showScreen('map'); renderMap(); bgmPlay('map');
  if(pendingUnlock != null){ const u = pendingUnlock; scrollMapTo(u - 1, false); setTimeout(() => playUnlock(u), 500); }
  else scrollMapTo(progress.unlocked, false);
}
function playUnlock(i){
  scrollMapTo(i, true);
  setTimeout(() => {
    const node = $(`.node[data-i="${i}"]`); if(!node){ pendingUnlock = null; return; }
    node.classList.add('rattle'); SFX.rattle();
    setTimeout(() => {
      node.classList.remove('rattle');
      const c = centerOf(node), col = STAGES[i].color;
      node.classList.add('breaking'); SFX.crack(); shakeApp();
      FX.burst(c.x, c.y, ['#d8d3ee','#8f89b3','#5c5683'], 22, { shapes:['shard','rect'], speed:520, size:9, g:900 });
      FX.burst(c.x, c.y, [col, '#fff', '#ffd23f'], 36, { shapes:['star','circle'], speed:460, size:7, g:250, life:1.1 });
      FX.ring(c.x, c.y, '#fff', 120, .55);
      setTimeout(() => {
        pendingUnlock = null;
        node.classList.remove('locked'); node.classList.add('born');
        const rays = document.createElement('span'); rays.className = 'rays'; node.prepend(rays);
        node.insertAdjacentHTML('beforeend', `<span class="node-stars">${[0,1,2].map(() => starSVG(false)).join('')}</span><span class="pulse-ring"></span><span class="flag"><span>NEW!</span></span>`);
        SFX.magic(); FX.ring(c.x, c.y, col, 160, .7);
        // 진행 경로 갱신
        const pts = mapGeom.pts.slice(0, i + 1);
        const d = pts.reduce((d, p, k, arr) => k === 0 ? `M${p.x} ${p.y}` : d + ` C${arr[k - 1].x} ${(arr[k - 1].y + p.y) / 2} ${p.x} ${(arr[k - 1].y + p.y) / 2} ${p.x} ${p.y}`, '');
        $('#prog-path').setAttribute('d', d);
        toast(`🔓 <b style="color:var(--gold)">${STAGES[i].key}</b> 스테이지가 열렸어요!`);
        setTimeout(() => { rays.remove(); node.classList.remove('breaking', 'born'); openStagePopup(i); }, 1500);
      }, 380);
    }, 1000);
  }, 650);
}

function openModal(html, { sheet = false, onClose = null, closable = true } = {}){
  const m = document.createElement('div'); m.className = 'modal' + (sheet ? ' sheet' : '');
  m.innerHTML = `<div class="card">${closable ? '<button class="icon-btn x" data-close aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' : ''}${html}</div>`;
  m._onClose = onClose;
  if(closable){
    m.addEventListener('click', e => { if(e.target === m || e.target.closest('[data-close]')){ SFX.click(); closeModal(m); } });
  }
  $('#modal-root').appendChild(m); return m;
}
function closeModal(m){ if(!m || !m.isConnected) return; m.remove(); if(m._onClose) m._onClose(); }
function closeAllModals(){ document.querySelectorAll('#modal-root .modal').forEach(m => m.remove()); }

  const earned = earnedPlates().includes(i + 1);
  const html = `
    <div class="sp-head">
      <div class="sp-badge" style="${colorVars(s.color)}"><small>${s.sub}</small><b>${s.short}</b></div>
      <div class="sp-title"><b>${s.key}</b><span>${mv.length ? `동작 ${mv.length}개 · 제한시간 ${timeLimit(mv.length)}초` : '동작이 아직 없어요'}</span></div>
    </div>
    <div class="sp-stars">${[0,1,2].map(k => starSVG(rec && k < rec.stars)).join('')}</div>
    <div class="stat-grid">
      <div class="stat"><small>최고 점수</small><b>${rec ? rec.score.toLocaleString() : '-'}</b></div>
      <div class="stat"><small>최고 기록</small><b>${rec ? rec.time.toFixed(1) + '초' : '-'}</b></div>

function loop(now){
  if(!G || !G.running) return;
  const dt = Math.min(.1, (now - G.last) / 1000); G.last = now;
  if(!G.paused && !G.frozen){
    G.timeLeft -= dt;
    if(G.fever && now > G.feverUntil) endFever();
    if(G.hint && !G.hinting && now - G.lastAct > 5000){ const t = findTarget(); if(t){ t.body.classList.add('hint'); G.hinting = true; } }
    const sec = Math.ceil(G.timeLeft);
    if(sec !== G.lastSec){ G.lastSec = sec; if(sec <= 5 && sec > 0) SFX.hurry(); }
  }
  const ratio = Math.max(0, G.timeLeft / G.limit);
  if(G.fever && !G.paused && !G.frozen && now - (G.emberT || 0) > 55){
    G.emberT = now; const br = $('#board').getBoundingClientRect(), bw = $('#app').getBoundingClientRect();
    FX.burst(bw.left + Math.random() * bw.width, bw.bottom - 4, ['#ff4f8b','#ffd23f','#ff7a2f','#fff3b0'], 3, { speed:160, up:520, g:-90, size:7, life:1.3, shapes:['circle','star'] });

  }
  $('#g-time').style.width = Math.min(100, ratio * 100) + '%';
  $('#g-sec').textContent = Math.max(0, Math.ceil(G.timeLeft)) + '초';
  const tb = $('#g-timebar'); tb.classList.toggle('low', ratio < .2); tb.classList.toggle('mid', ratio >= .2 && ratio < .45);

}

function finishClear(){
  G.running = false; endFever(); clearHint(); cancelAnimationFrame(rafId);
  const used = Math.max(0, G.limit - G.timeLeft), ratio = Math.max(0, G.timeLeft) / G.limit;
  const timeBonus = Math.floor(Math.max(0, G.timeLeft)) * 50, heartBonus = G.rule === 'hearts' ? G.hearts * 300 : 0;
  const base = G.score; G.score += timeBonus + heartBonus;
  const stars = (G.mistakes === 0 && ratio >= .3) ? 3 : (G.mistakes <= 1 && ratio >= .12) ? 2 : 1;
  const i = G.stage, old = progress.records[i];
  const beforePlates = earnedPlates(), beforeSkins = skinsByRecords();
  const isBest = !old || G.score > old.score;
  progress.records[i] = {
    stars:Math.max(stars, old ? old.stars : 0), score:Math.max(G.score, old ? old.score : 0),
    time:old ? Math.min(old.time, used) : used, combo:Math.max(G.maxCombo, old && old.combo ? old.combo : 0)
  };
  if(i === progress.unlocked && i < 11){ progress.unlocked = i + 1; pendingUnlock = i + 1; }

const clampInt = (v, a, b) => Math.max(a, Math.min(b, Math.floor(+v) || 0));
function buildSave(){
  return { app:SAVE_TAG, v:1, savedAt:new Date().toISOString(), profile:{ name:profile.name, plate:profile.plate, skin:profile.skin }, progress:{ unlocked:progress.unlocked, records:progress.records }, mycolors:STUDENT_MODE ? myColors() : undefined };
}
function ymdNow(){ const d = new Date(); return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }
function saveFileName(){ const nm = (profile.name || '수련생').replace(/[\\/:*?"<>|\s]+/g, ''); return `정도타일_${nm || '수련생'}_${ymdNow()}.json`; }
function downloadBlob(blob, filename){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function parseSave(text){
  let o; try{ o = JSON.parse(String(text).replace(/^\uFEFF/, '').trim()); }catch(e){ return null; }
  if(!o || o.app !== SAVE_TAG || !o.progress || typeof o.progress !== 'object') return null;
  const recs = {}; let maxClear = -1;
  for(let i = 0; i < 12; i++){
    const r = o.progress.records && o.progress.records[i];
    if(r && typeof r === 'object'){ recs[i] = { stars:clampInt(r.stars, 1, 3), score:clampInt(r.score, 0, 1e9), time:Math.max(0, +r.time || 0), combo:clampInt(r.combo, 0, 9999) }; maxClear = i; }
  }
  const unlocked = Math.max(clampInt(o.progress.unlocked, 0, 11), Math.min(11, maxClear + 1));
  const p = o.profile || {};
  const mc = {}; if(o.mycolors && typeof o.mycolors === 'object') Object.keys(o.mycolors).slice(0, 400).forEach(k => { if(k.length <= 60 && HEX6.test(o.mycolors[k])) mc[k] = String(o.mycolors[k]).toLowerCase(); });
  return { name:String(p.name || '').slice(0, 8), plate:clampInt(p.plate, 0, PLATE_NAMES.length - 1), skin:clampInt(p.skin, 0, SKIN_NAMES.length - 1), unlocked, records:recs, mycolors:mc, savedAt:o.savedAt || '' };
}
function saveCode(){ return 'JDT1.' + btoa(unescape(encodeURIComponent(JSON.stringify(buildSave())))); }
function readCode(code){
  const c = String(code || '').trim().replace(/\s+/g, ''); if(!c.startsWith('JDT1.')) return null;
  try{ return parseSave(decodeURIComponent(escape(atob(c.slice(5))))); }catch(e){ return null; }
}
function summaryOf(d){
  const stars = Object.values(d.records).reduce((a, r) => a + r.stars, 0), clears = Object.keys(d.records).length;
  return { stars, clears };
}
function openSaveMenu(){
  const sm = summaryOf({ records:progress.records });
  const m = openModal(`<h2>내 기록</h2><div class="sub">${esc(profile.name || '이름 없음')} · ★ ${sm.stars}개 · ${sm.clears}스테이지 클리어</div>
    <div class="stack">
      <button class="btn mint big" id="sv-save">💾 저장하기</button>
      <button class="btn sky big" id="sv-load">📂 불러오기</button>
      <p class="adm-note" style="text-align:center;margin:2px 0 0">기기를 바꾸거나 인터넷 기록을 지우면 별과 기록이 사라질 수 있어요.<br>가끔 저장해 두면 안전해요!</p>
    </div>`);
  $('#sv-save', m).onclick = () => { closeModal(m); doSave(); };
  $('#sv-load', m).onclick = () => { SFX.click(); closeModal(m); openLoadModal(); };
}
function doSave(){
  const fn = saveFileName();
  downloadBlob(new Blob([JSON.stringify(buildSave())], { type:'application/json' }), fn);
  SFX.reward(); FX.confetti(50);
  const sm = summaryOf({ records:progress.records });
  const m = openModal(`<div style="text-align:center"><div class="save-ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l5 5 10-11"/></svg></div>
    <h2>저장되었습니다!</h2><div class="sub" style="margin-bottom:8px">★ ${sm.stars}개 · ${sm.clears}스테이지 기록</div>
    <span class="file-chip">${esc(fn)}</span>
    <p class="adm-note" style="margin-bottom:12px">휴대폰·컴퓨터의 <b style="color:#fff">다운로드</b> 폴더에 들어 있어요.<br>이 파일을 지우지 말고 잘 보관하세요.</p></div>
    <div class="stack"><button class="btn gold big" id="ok-ok">확인</button>
    <div class="row"><button class="btn ghost sm" id="ok-how">불러오는 방법</button><button class="btn ghost sm" id="ok-code">코드로 복사</button></div></div>`);
  $('#ok-ok', m).onclick = () => { SFX.click(); closeModal(m); };
  $('#ok-how', m).onclick = () => { SFX.click(); closeModal(m); openLoadTutorial(); };
  $('#ok-code', m).onclick = async e => {
    const c = saveCode(); let ok = false;
    try{ await navigator.clipboard.writeText(c); ok = true; }catch(err){}
    if(!ok){ const ta = document.createElement('textarea'); ta.value = c; document.body.appendChild(ta); ta.select(); try{ ok = document.execCommand('copy'); }catch(err){} ta.remove(); }
    SFX.click(); e.target.textContent = ok ? '복사했어요 ✔' : '복사 실패';
  };
}
function openLoadModal(){
  const m = openModal(`<h2>불러오기</h2><div class="sub">저장해 둔 파일로 기록을 되살려요</div>

      <button class="btn gold big" id="ld-file">📂 저장 파일 고르기</button>

        <div class="stack" style="margin-top:8px"><textarea class="code-box" id="ld-code" placeholder="JDT1.로 시작하는 코드를 붙여넣기" spellcheck="false"></textarea>
        <button class="btn ghost" id="ld-code-go">코드로 불러오기</button></div></details>

function matchStage(filename){
  const n = filename.replace(/\.[^.]+$/, '').replace(/\s+/g, '');
  for(let i = 8; i < 12; i++) if(n.includes(STAGES[i].key)) return i;
  const m = n.match(/([1-8])장/); if(m) return +m[1] - 1;
  const d = n.match(/^(?:태극|stage|st)?0?(\d{1,2})$/i); if(d && +d[1] >= 1 && +d[1] <= 12) return +d[1] - 1;
  return -1;
}
async function readTxt(file){
  const buf = await file.arrayBuffer(); let t;
  try{ t = new TextDecoder('utf-8', { fatal:true }).decode(buf); }
  catch(e){ try{ t = new TextDecoder('euc-kr').decode(buf); }catch(e2){ t = new TextDecoder().decode(buf); } }
  return t;
}
function parseLines(t, i){
  let lines = t.replace(/^﻿/, '').split(/\r?\n/).map(s => s.replace(/^\s*\d+\s*[.)\]:-]\s*/, '').trim()).filter(s => s && !s.startsWith('#'));
  if(i != null && lines.length){ const f = norm(lines[0]); if(f === norm(STAGES[i].key) || f === norm(STAGES[i].short) || f === norm(STAGES[i].key + '스테이지') || f === '스테이지') lines.shift(); }
  return lines;
}

      <div class="seg" id="mode-seg">${[['type','종류별','막기·지르기…'],['mix','알록달록','동작마다 다르게'],['one','한 가지 색','']].map(([v, l, sm]) => `<button data-v="${v}" class="${cfg.tileMode === v ? 'on' : ''}">${l}${sm ? `<small>${sm}</small>` : ''}</button>`).join('')}</div>`;
    const box = $('#color-box', m);
    box.querySelectorAll('[data-pal]').forEach(b => b.onclick = () => {
      const c = getCfg(), id = b.dataset.pal; SFX.click();
      if(id === 'custom'){ if(!Array.isArray(c.custom) || c.custom.length !== 6) c.custom = activePalette(c).slice(); c.pal = 'custom'; }
      else c.pal = id;
      setCfg(c); draw();
    });
    const setSlot = (i, hex) => { const c = getCfg(); const arr = activePalette(c).slice(); arr[i] = hex.toLowerCase(); c.custom = arr; c.pal = 'custom'; setCfg(c); };
    box.querySelectorAll('.sw').forEach(b => b.onclick = () => { SFX.click(); setSlot(+b.dataset.slot, b.dataset.c); draw(); });
    box.querySelectorAll('input[type=color]').forEach(inp => {
      inp.oninput = () => { setSlot(+inp.dataset.slot, inp.value); drawPreview(); const dots = box.querySelectorAll('[data-pal="custom"] .pal-dots i'); activePalette().forEach((c, k) => { if(dots[k]) dots[k].style.background = c; }); const sw = inp.closest('.cust-row').querySelectorAll('.sw'); sw.forEach(x => x.classList.remove('on')); };
      inp.onchange = () => draw();
    });
    box.querySelectorAll('#mode-seg button').forEach(b => b.onclick = () => { const c = getCfg(); c.tileMode = b.dataset.v; setCfg(c); SFX.click(); draw(); });
    drawPreview();
  };
  let mvStage = 0;
  const drawMoveColors = () => {
    const cfg = getCfg(), mc = cfg.moveColors || {}, all = getMoves();
    const seen = new Set(), list = [];
    (all[STAGES[mvStage].key] || []).forEach(n => { const k = norm(n); if(!seen.has(k)){ seen.add(k); list.push(n); } });
    const opts = STAGES.map((st, i) => `<option value="${i}" ${i === mvStage ? 'selected' : ''}>${st.key} (${(all[st.key] || []).length}개)</option>`).join('');
    const rows = list.length ? list.map(n => { const k = norm(n), cur = tileColor(n, cfg), own = !!mc[k];
      return `<div class="mv-row" data-k="${esc(k)}"><div class="mv-top"><span class="mv-dot" style="background:${cur}"></span><b>${esc(n)}</b><button class="btn ghost sm" data-reset ${own ? '' : 'disabled'}>기본색</button></div>
        <div class="cust-sw">${SWATCHES.map(c => `<button class="sw ${own && mc[k].toLowerCase() === c ? 'on' : ''}" data-c="${c}" style="background:${c}" aria-label="${esc(n)} ${c}"></button>`).join('')}<input type="color" value="${cur}" aria-label="${esc(n)} 색 직접 고르기"></div></div>`; }).join('')
      : '<p class="adm-note">이 스테이지에 동작이 없어요</p>';
    $('#mv-colors', m).innerHTML = `<select class="field" id="mv-stage" style="font-size:17px;padding:10px">${opts}</select>${rows}
      ${list.length ? '<button class="btn ghost sm" style="width:100%;margin-top:10px" id="mv-clear">이 스테이지 동작 색 모두 기본으로</button>' : ''}`;
    const box = $('#mv-colors', m);
    const setMove = (k, hex) => { const c = getCfg(); c.moveColors = Object.assign({}, c.moveColors); if(hex) c.moveColors[k] = hex.toLowerCase(); else delete c.moveColors[k]; setCfg(c); };
    $('#mv-stage', m).onchange = e => { mvStage = +e.target.value; drawMoveColors(); };
    box.querySelectorAll('.mv-row').forEach(row => {
      const k = row.dataset.k, nm = row.querySelector('b').textContent;
      row.querySelectorAll('.sw').forEach(b => b.onclick = () => { setMove(k, b.dataset.c); SFX.click(); toast(`<b style="color:${b.dataset.c}">${esc(nm)}</b> 색 저장!`); drawMoveColors(); });
      const inp = row.querySelector('input[type=color]');

      row.querySelector('[data-reset]').onclick = () => { setMove(k, null); SFX.click(); drawMoveColors(); };

  };
  const drawThemes = () => {

    $('#theme-grid', m).innerHTML = THEMES.map(t => `<button class="theme-btn ${cfg.theme === t.id ? 'on' : ''}" data-th="${t.id}"><i style="background:linear-gradient(135deg,${t.bg[0]},${t.bg[1]} 55%,${t.bg[2]})"></i><span>${t.name}</span></button>`).join('');

      <button class="btn ghost sm" style="width:100%" id="nc-reset" ${on ? '' : 'disabled'}>기본색(흰색)으로</button>`;
    const box = $('#nc-box', m), save = hex => { const c = getCfg(); c.nameColor = hex; setCfg(c); applyTheme(); };
    box.querySelectorAll('.sw').forEach(b => b.onclick = () => { SFX.click(); save(b.dataset.c); drawNameColor(); });
    const inp = box.querySelector('input[type=color]');
    inp.oninput = () => { save(inp.value.toLowerCase()); const pn = box.querySelector('.plate-name'); if(pn) pn.style.color = inp.value; box.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); box.querySelector('#nc-reset').disabled = false; };
    inp.onchange = () => drawNameColor();
    $('#nc-reset', m).onclick = () => { SFX.click(); save(null); drawNameColor(); };
  };
  draw(); drawThemes(); drawMoveColors(); drawNameColor();
}

function exportFile(student){

}

  const lastS = LS.get('last', null); let st = (typeof lastS === 'number' && lastS >= 0 && lastS < 12) ? lastS : Math.min(11, progress.unlocked);
  const m = openModal(`<h2>내 타일 색</h2><div class="sub">타일마다 좋아하는 색으로 바꿔요</div><div id="my-box"></div>`, { sheet:true });
  const box = $('#my-box', m);
  const draw = () => {
    const all = getMoves(), seen = new Set(), list = [];
    (all[STAGES[st].key] || []).forEach(n => { const k = norm(n); if(!seen.has(k)){ seen.add(k); list.push(n); } });
    const mine = myColors(), cfg = getCfg();
    const opts = STAGES.map((x, i) => `<option value="${i}" ${i === st ? 'selected' : ''}>${x.key} (${(all[x.key] || []).length}개)</option>`).join('');
    const rows = list.length ? list.map(n => {

      return `<div class="mv-row my" data-k="${esc(k)}">
        <div class="my-prev pv-box"><div class="tile" style="${colorVars(cur)};--t:72px;--k:${fitK(n)}"><svg class="ico" viewBox="0 0 24 24" fill="rgba(255,255,255,.9)">${ICONS[ty]}</svg><span class="lbl">${esc(n)}</span></div></div>
        <div class="my-ctl"><div class="cust-sw">${SWATCHES.map(c => `<button class="sw ${own && mine[k] === c ? 'on' : ''}" data-c="${c}" style="background:${c}" aria-label="${esc(n)} ${c}"></button>`).join('')}<input type="color" value="${cur}" aria-label="${esc(n)} 색 직접 고르기"></div>
        <button class="btn ghost sm" data-reset ${own ? '' : 'disabled'}>기본색으로</button></div></div>`;
    }).join('') : '<p class="adm-note">이 스테이지에는 동작이 없어요</p>';
    box.innerHTML = `${STORE_OK ? '' : '<div class="empty-note">이 화면에서는 색이 저장되지 않을 수 있어요.<br>💾 내 기록 저장을 하면 색도 같이 저장돼요.</div>'}
      <select class="field" id="my-stage" style="font-size:17px;padding:10px">${opts}</select>${rows}
      ${list.length ? '<button class="btn ghost sm" style="width:100%;margin-top:10px" id="my-clear">이 스테이지 색 모두 기본으로</button>' : ''}`;
    $('#my-stage', box).onchange = e => { st = +e.target.value; draw(); };
    box.querySelectorAll('.mv-row').forEach(row => {
      const k = row.dataset.k, tile = row.querySelector('.tile');
      row.querySelectorAll('.sw').forEach(b => b.onclick = () => { SFX.click(); setMyColor(k, b.dataset.c); draw(); });
      const inp = row.querySelector('input[type=color]');
      inp.oninput = () => { setMyColor(k, inp.value); tile.style.cssText = `${colorVars(inp.value)};--t:72px;--k:${tile.style.getPropertyValue('--k')}`; row.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); row.querySelector('[data-reset]').disabled = false; };
      inp.onchange = () => draw();
      row.querySelector('[data-reset]').onclick = () => { SFX.click(); setMyColor(k, null); draw(); };
    });
    const clr = $('#my-clear', box);
    if(clr) clr.onclick = () => { SFX.click(); list.forEach(n => setMyColor(norm(n), null)); toast('기본 색으로 되돌렸어요'); draw(); };
